<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — random 1-on-1 stranger chat</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center p-4 font-sans">
<div class="w-full max-w-xl bg-white rounded-2xl shadow-lg flex flex-col h-[calc(100vh-2rem)] max-h-[820px] overflow-hidden">

  <header class="px-4 py-3 border-b border-slate-200 flex items-center gap-2 flex-wrap">
    <h1 class="text-lg font-semibold flex-1">Relay</h1>
    <span id="stats" class="text-xs text-slate-500">0 online</span>
    <div id="status" class="flex items-center gap-1.5 text-xs text-slate-500">
      <span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-400 inline-block"></span>
      <span id="statusText">Idle</span>
    </div>
  </header>

  <!-- Landing: required display name + search -->
  <section id="view-landing" class="flex-1 flex flex-col justify-center gap-4 p-6">
    <p class="text-sm text-slate-600">Random 1-on-1 stranger chat. Press <b>Search</b> to connect — <b>Skip</b> jumps to the next stranger. Chats burn forever when anyone leaves.</p>
    <label class="text-sm font-medium">Your display name (required)
      <input id="name" placeholder="e.g. Alex" maxlength="32" autocomplete="username" required
        class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </label>
    <p id="nameError" class="hidden text-sm text-red-600">Please enter a display name first.</p>
    <button id="searchBtn" disabled class="w-full py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-50">Search for a stranger</button>
  </section>

  <!-- Searching -->
  <section id="view-searching" class="hidden flex-1 flex-col items-center justify-center gap-4 p-6">
    <div class="w-10 h-10 rounded-full border-4 border-slate-200 border-t-blue-600 animate-spin"></div>
    <p class="text-sm text-slate-600">Looking for a stranger…</p>
    <button id="cancelBtn" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm">Cancel</button>
  </section>

  <!-- Chat -->
  <section id="view-chat" class="hidden flex-1 flex-col overflow-hidden">
    <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
      <span id="peerLabel" class="flex-1 text-sm font-medium truncate">Stranger</span>
      <button id="skipBtn" class="text-xs px-3 py-1.5 rounded-md bg-amber-500 text-white hover:bg-amber-600">Skip / Next</button>
      <button id="leaveBtn" class="text-xs px-3 py-1.5 rounded-md bg-slate-200 hover:bg-slate-300">Leave</button>
    </div>
    <div id="notice" class="hidden px-4 py-2 text-sm text-center"></div>
    <main id="chat" aria-live="polite" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-slate-50"></main>
    <form id="form" class="flex gap-2 p-3 border-t border-slate-200">
      <input id="input" placeholder="Type a message…" maxlength="2000" autocomplete="off"
        class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button id="send" type="submit" disabled class="px-5 py-2 rounded-lg bg-blue-600 text-white disabled:opacity-50 hover:bg-blue-700">Send</button>
    </form>
  </section>
</div>

<script>
// Relay frontend: Vanilla JS + WebSocket only. Random stranger matching, no history.
const params = new URLSearchParams(location.search);
// TODO: after renaming the Render service, change this to wss://relay.onrender.com
// ?server= override always wins (useful for local dev + migration).
const DEFAULT_BACKEND = 'wss://sundaysolution.onrender.com';
const WS_URL = params.get('server')
  || ((location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? `ws://${location.hostname}:8080`
    : DEFAULT_BACKEND);

const $ = (id) => document.getElementById(id);
const viewLanding = $('view-landing'), viewSearching = $('view-searching'), viewChat = $('view-chat');
const nameEl = $('name'), nameError = $('nameError'), searchBtn = $('searchBtn');
const statsEl = $('stats'), peerLabel = $('peerLabel'), notice = $('notice');
const chat = $('chat'), form = $('form'), input = $('input'), sendBtn = $('send');
const statusText = $('statusText'), dot = $('dot');

nameEl.value = localStorage.getItem('relay-display-name') || '';
// Single persistent socket for the whole session (search → chat → skip → …).
let ws = null, connected = false, state = 'idle'; // idle | searching | chatting

function username() {
  return (nameEl.value.trim() || '').slice(0, 32);
}

function refreshUI() {
  const hasName = username().length > 0;
  nameError.classList.toggle('hidden', hasName || state !== 'idle');
  // Name is required: search only from landing with a name + open socket.
  searchBtn.disabled = !(connected && hasName && state === 'idle');
  nameEl.disabled = state !== 'idle';
  sendBtn.disabled = state !== 'chatting';
}

function setStatus(label, color) {
  statusText.textContent = label;
  dot.className = `w-2.5 h-2.5 rounded-full inline-block ${color}`;
}

function showOnly(view) {
  for (const v of [viewLanding, viewSearching, viewChat]) v.classList.add('hidden');
  view.classList.remove('hidden');
}

function showLanding() {
  state = 'idle';
  setStatus(connected ? 'Idle' : 'Connecting…', connected ? 'bg-slate-400' : 'bg-amber-500 animate-pulse');
  showOnly(viewLanding);
  refreshUI();
}

function showSearching() {
  state = 'searching';
  setStatus('Searching…', 'bg-amber-500 animate-pulse');
  showOnly(viewSearching);
  viewSearching.classList.add('flex');
  refreshUI();
}

function showChat(peer) {
  state = 'chatting';
  setStatus(`Chatting with ${peer}`, 'bg-green-500');
  peerLabel.textContent = `Stranger: ${peer}`;
  notice.classList.add('hidden');
  showOnly(viewChat);
  viewChat.classList.add('flex');
  refreshUI();
  input.focus();
}

function showNotice(msg, bad) {
  notice.textContent = msg;
  notice.className = `px-4 py-2 text-sm text-center ${bad ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-800'}`;
  notice.classList.remove('hidden');
}

function addMessage({ username: from, text, timestamp }) {
  const mine = from === username();
  const div = document.createElement('div');
  div.className = `max-w-[75%] px-3 py-2 rounded-xl leading-snug break-words ${mine ? 'self-end bg-blue-600 text-white rounded-br-sm' : 'self-start bg-slate-200 text-slate-900 rounded-bl-sm'}`;
  const meta = document.createElement('div');
  meta.className = 'text-[0.68rem] opacity-70 mb-0.5';
  meta.textContent = `${from} · ${new Date(timestamp).toLocaleTimeString()}`;
  const body = document.createElement('div');
  body.textContent = text; // textContent, never innerHTML — strangers are untrusted
  div.append(meta, body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function connect() {
  setStatus('Connecting…', 'bg-amber-500 animate-pulse');
  ws = new WebSocket(WS_URL);

  ws.onopen = () => { connected = true; if (state === 'idle') showLanding(); refreshUI(); };

  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'stats') {
      statsEl.textContent = `${m.online} online · ${m.searching} searching`;
    } else if (m.type === 'searching') {
      showSearching();
    } else if (m.type === 'matched') {
      chat.innerHTML = '';
      showChat(m.peer);
    } else if (m.type === 'peer-skipped') {
      state = 'idle';
      setStatus('Skipped', 'bg-red-500');
      showNotice('Stranger skipped. Press Search to find someone new.', true);
      sendBtn.disabled = true;
    } else if (m.type === 'peer-left') {
      state = 'idle';
      setStatus('Ended', 'bg-red-500');
      showNotice('Stranger left — chat burned. Press Search to find someone new.', true);
      sendBtn.disabled = true;
    } else if (m.type === 'cancelled') {
      showLanding();
    } else if (m.type === 'username-required') {
      state = 'idle';
      showLanding();
      nameError.classList.remove('hidden');
      nameEl.focus();
    } else if (m.type === 'chat') {
      addMessage(m);
    }
    // 'already-in-chat' / 'already-searching' need no UI change.
  };

  ws.onclose = () => {
    connected = false;
    if (state === 'chatting') {
      state = 'idle';
      setStatus('Disconnected', 'bg-red-500');
      showNotice('Connection lost — chat burned. Reconnect to search again.', true);
      sendBtn.disabled = true;
    } else {
      showLanding();
    }
    setTimeout(connect, 3000); // reconnect the lobby socket; pairs never resurrect
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

searchBtn.onclick = () => {
  if (!username()) { nameError.classList.remove('hidden'); nameEl.focus(); return; }
  localStorage.setItem('relay-display-name', username());
  ws.send(JSON.stringify({ type: 'search', username: username() }));
};

$('cancelBtn').onclick = () => {
  try { ws.send(JSON.stringify({ type: 'cancel' })); } catch {}
  showLanding();
};

$('skipBtn').onclick = () => {
  // One click: burn this pairing and auto-queue for the next stranger.
  chat.innerHTML = '';
  showSearching();
  ws.send(JSON.stringify({ type: 'next', username: username() }));
};

$('leaveBtn').onclick = () => {
  try { ws.send(JSON.stringify({ type: 'leave' })); } catch {}
  chat.innerHTML = '';
  showLanding();
};

nameEl.addEventListener('input', () => {
  localStorage.setItem('relay-display-name', username());
  refreshUI();
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN || state !== 'chatting') return;
  ws.send(JSON.stringify({ type: 'message', text }));
  input.value = '';
  input.focus();
});

showLanding();
connect();
</script>
</body>
</html>
