<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SundaySolution Chat</title>
<style>
  /* Pure CSS, no frameworks. Flexbox column layout, scrollable message area. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f1f5f9; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
  .app { width: 100%; max-width: 640px; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); display: flex; flex-direction: column; height: calc(100vh - 32px); max-height: 800px; overflow: hidden; }
  header { padding: 14px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; flex: 1; }
  /* Status dot: color driven by .online/.connecting classes on #status */
  #status { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: #64748b; }
  #status .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
  #status.online .dot { background: #22c55e; }
  #status.connecting .dot { background: #f59e0b; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  #name { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; width: 150px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
  /* Sent = right/blue, received = left/gray */
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
  .msg.sent { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.received { align-self: flex-start; background: #e2e8f0; color: #0f172a; border-bottom-left-radius: 4px; }
  .msg .meta { font-size: .68rem; opacity: .7; margin-bottom: 2px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; }
  #input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
  button { padding: 10px 18px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>SundaySolution Chat</h1>
    <div id="status" class="connecting"><span class="dot"></span><span id="statusText">Connecting…</span></div>
    <!-- Display name set before chatting -->
    <input id="name" placeholder="Display name" maxlength="32" autocomplete="username">
  </header>
  <main id="chat" aria-live="polite"></main>
  <form id="form">
    <input id="input" placeholder="Type a message…" maxlength="2000" autocomplete="off">
    <button id="send" type="submit" disabled>Send</button>
  </form>
</div>

<script>
// Native WebSocket only — no Socket.io / React / build tools.

// Resolve server URL: ?server=wss://xxx.onrender.com override,
// localhost default for dev, same-host fallback for single-service deploys.
const params = new URLSearchParams(location.search);
const WS_URL = params.get('server')
  || ((location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'ws://localhost:8080'
    : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
// ^ Deploy note: frontend on GitHub/Cloudflare Pages + backend on Render
//   → open index.html as https://you.github.io/?server=wss://your-api.onrender.com

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const nameEl = document.getElementById('name');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');

nameEl.value = localStorage.getItem('chat-name') || '';
nameEl.addEventListener('change', () => localStorage.setItem('chat-name', nameEl.value.trim()));

let ws = null, retryCount = 0;

function setStatus(state, label) {
  statusEl.className = state; // '' | 'connecting' | 'online' → drives dot color
  statusText.textContent = label;
  sendBtn.disabled = state !== 'online';
}

function addMessage({ username, text, timestamp }) {
  const isMine = (username || '') === (nameEl.value.trim() || 'Anonymous');
  const div = document.createElement('div');
  div.className = 'msg ' + (isMine ? 'sent' : 'received');
  // textContent (not innerHTML) prevents XSS from other chatters.
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = `${username} · ${new Date(timestamp).toLocaleTimeString()}`;
  const body = document.createElement('div');
  body.textContent = text;
  div.append(meta, body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight; // auto-scroll to newest
}

function connect() {
  setStatus('connecting', 'Connecting…');
  ws = new WebSocket(WS_URL);

  ws.onopen = () => { retryCount = 0; setStatus('online', 'Connected'); };
  ws.onmessage = (e) => { try { addMessage(JSON.parse(e.data)); } catch {} };
  ws.onclose = () => {
    // Reconnect loop with exponential backoff (caps at 10s).
    // Handles Render free-tier 15-min spin-down: first retry wakes the server.
    setStatus('', 'Disconnected — retrying…');
    const delay = Math.min(1000 * 2 ** retryCount++, 10000);
    setTimeout(connect, delay || 3000);
  };
  ws.onerror = () => ws.close(); // let onclose drive the retry
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    username: nameEl.value.trim() || 'Anonymous',
    text,
    timestamp: new Date().toISOString(),
  }));
  input.value = '';
  input.focus();
});

connect();
</script>
</body>
</html>
