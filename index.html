<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — one-time 1-on-1 chat</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center p-4 font-sans">
<div class="w-full max-w-xl bg-white rounded-2xl shadow-lg flex flex-col h-[calc(100vh-2rem)] max-h-[820px] overflow-hidden">

  <header class="px-4 py-3 border-b border-slate-200 flex items-center gap-2 flex-wrap">
    <h1 class="text-lg font-semibold flex-1">Relay</h1>
    <span id="count" class="text-xs text-slate-500 hidden">1/2</span>
    <div id="status" class="flex items-center gap-1.5 text-xs text-slate-500">
      <span id="dot" class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
      <span id="statusText">Idle</span>
    </div>
  </header>

  <!-- Landing: display name + create / paste link -->
  <section id="view-landing" class="flex-1 flex flex-col justify-center gap-4 p-6">
    <p class="text-sm text-slate-600">Private one-time chat. Share the link — it fits <b>2 people max</b> and <b>burns forever</b> when anyone leaves.</p>
    <label class="text-sm font-medium">Your display name
      <input id="name" placeholder="e.g. Alex" maxlength="32" autocomplete="username"
        class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </label>
    <button id="createBtn" class="w-full py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-50">Create private link</button>
    <div class="flex items-center gap-2 text-xs text-slate-400"><span class="flex-1 h-px bg-slate-200"></span>or<span class="flex-1 h-px bg-slate-200"></span></div>
    <label class="text-sm font-medium">Paste a link to join
      <div class="mt-1 flex gap-2">
        <input id="joinInput" placeholder="https://…/?room=abc123" autocomplete="off"
          class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="joinBtn" class="px-4 py-2 rounded-lg bg-slate-800 text-white hover:bg-slate-900">Join</button>
      </div>
    </label>
  </section>

  <!-- Room: share link + chat -->
  <section id="view-room" class="hidden flex-1 flex-col overflow-hidden">
    <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
      <input id="linkBox" readonly class="flex-1 text-xs px-2 py-1.5 border border-slate-300 rounded-md bg-white text-slate-600 truncate">
      <button id="copyBtn" class="text-xs px-3 py-1.5 rounded-md bg-blue-600 text-white hover:bg-blue-700">Copy</button>
      <button id="newBtn" class="text-xs px-3 py-1.5 rounded-md bg-slate-200 hover:bg-slate-300">New</button>
    </div>
    <div id="notice" class="hidden px-4 py-2 text-sm text-center"></div>
    <main id="chat" aria-live="polite" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-slate-50"></main>
    <form id="form" class="flex gap-2 p-3 border-t border-slate-200">
      <input id="input" placeholder="Type a message…" maxlength="2000" autocomplete="off"
        class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button id="send" type="submit" disabled class="px-5 py-2 rounded-lg bg-blue-600 text-white disabled:opacity-50 hover:bg-blue-700">Send</button>
    </form>
  </section>
</div>

<script>
// Relay frontend: Vanilla JS + WebSocket only. Ephemeral rooms, no history.
const params = new URLSearchParams(location.search);
// TODO: after renaming the Render service, change this to wss://relay.onrender.com
// ?server= override always wins (useful for local dev + migration).
const DEFAULT_BACKEND = 'wss://sundaysolution.onrender.com';
const WS_URL = params.get('server')
  || ((location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? `ws://${location.hostname}:8080`
    : DEFAULT_BACKEND);

const $ = (id) => document.getElementById(id);
const viewLanding = $('view-landing'), viewRoom = $('view-room');
const nameEl = $('name'), joinInput = $('joinInput');
const chat = $('chat'), form = $('form'), input = $('input'), sendBtn = $('send');
const statusText = $('statusText'), dot = $('dot'), countEl = $('count');
const linkBox = $('linkBox'), notice = $('notice');

nameEl.value = localStorage.getItem('relay-display-name') || localStorage.getItem('chat-name') || '';
nameEl.addEventListener('change', () => localStorage.setItem('relay-display-name', nameEl.value.trim()));

let ws = null, roomId = params.get('room') || null, live = false;

function displayName() {
  return (nameEl.value.trim() || localStorage.getItem('relay-display-name') || '').trim() || 'Anonymous';
}

function setStatus(label, color) {
  statusText.textContent = label;
  dot.className = `w-2.5 h-2.5 rounded-full inline-block ${color}`;
  sendBtn.disabled = !live;
}

function showRoom() {
  viewLanding.classList.add('hidden');
  viewRoom.classList.remove('hidden');
  viewRoom.classList.add('flex');
  const link = `${location.origin}${location.pathname}?room=${roomId}`;
  linkBox.value = link;
  countEl.classList.remove('hidden');
}

function showNotice(msg, bad) {
  notice.textContent = msg;
  notice.className = `px-4 py-2 text-sm text-center ${bad ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-800'}`;
  notice.classList.remove('hidden');
}

function setCount(n) { countEl.textContent = `${n}/2`; }

function addMessage({ username, text, timestamp }) {
  const mine = (username || '') === displayName();
  const div = document.createElement('div');
  div.className = `max-w-[75%] px-3 py-2 rounded-xl leading-snug break-words ${mine ? 'self-end bg-blue-600 text-white rounded-br-sm' : 'self-start bg-slate-200 text-slate-900 rounded-bl-sm'}`;
  const meta = document.createElement('div');
  meta.className = 'text-[0.68rem] opacity-70 mb-0.5';
  meta.textContent = `${username} · ${new Date(timestamp).toLocaleTimeString()}`;
  const body = document.createElement('div');
  body.textContent = text; // textContent, never innerHTML — peers are untrusted
  div.append(meta, body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function connect(mode) {
  setStatus('Connecting…', 'bg-amber-500 animate-pulse');
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    if (mode === 'create') ws.send(JSON.stringify({ type: 'create', username: displayName() }));
    else ws.send(JSON.stringify({ type: 'join', roomId, username: displayName() }));
  };

  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'created') {
      roomId = m.roomId;
      history.replaceState(null, '', `?room=${roomId}`);
      showRoom();
      setCount(1);
      setStatus('Waiting for peer… 1/2', 'bg-amber-500');
      showNotice('Share the link above. It burns forever once anyone leaves.');
    } else if (m.type === 'joined') {
      showRoom();
      setCount(m.count);
      live = m.count === 2;
      setStatus(live ? 'Connected 2/2' : 'Waiting for peer… 1/2', live ? 'bg-green-500' : 'bg-amber-500');
    } else if (m.type === 'peer-joined') {
      setCount(m.count);
      live = true;
      setStatus('Connected 2/2', 'bg-green-500');
      showNotice('Peer joined. This link now accepts no one else.');
    } else if (m.type === 'peer-left') {
      live = false;
      setStatus('Burned', 'bg-red-500');
      setCount(2);
      showNotice('Chat over — link is permanently burned. Create a new one.', true);
    } else if (m.type === 'room-full') {
      live = false;
      setStatus('Disabled', 'bg-red-500');
      showNotice('This link already has 2 people — it is disabled.', true);
    } else if (m.type === 'link-disabled') {
      live = false;
      setStatus('Disabled', 'bg-red-500');
      showNotice('This link is burned or invalid. Ask for a fresh one.', true);
    } else if (m.type === 'chat') {
      addMessage(m);
    }
  };

  // No auto-reconnect: one-time links must not resurrect after burn.
  ws.onclose = () => { if (live) { live = false; setStatus('Disconnected', 'bg-red-500'); } };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

$('createBtn').onclick = () => {
  localStorage.setItem('relay-display-name', nameEl.value.trim());
  roomId = null;
  connect('create');
};

$('joinBtn').onclick = () => {
  const v = joinInput.value.trim();
  const m = v.match(/[?&]room=([0-9a-f]{8,64})/i) || v.match(/^([0-9a-f]{8,64})$/i);
  const id = m ? m[1] : null;
  if (!id) { alert('Paste a valid Relay link (…?room=…)'); return; }
  roomId = id;
  localStorage.setItem('relay-display-name', nameEl.value.trim());
  history.replaceState(null, '', `?room=${roomId}`);
  connect('join');
};

$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(linkBox.value); $('copyBtn').textContent = 'Copied!'; }
  catch { linkBox.select(); document.execCommand('copy'); }
  setTimeout(() => ($('copyBtn').textContent = 'Copy'), 1500);
};

$('newBtn').onclick = () => {
  try { ws && ws.close(); } catch {}
  location.href = location.pathname; // drop ?room=, back to landing
};

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN || !live) return;
  ws.send(JSON.stringify({ type: 'message', text }));
  input.value = '';
  input.focus();
});

// Deep link: ?room=xxx joins directly.
if (roomId) connect('join');
else setStatus('Idle', 'bg-slate-400');
</script>
</body>
</html>
