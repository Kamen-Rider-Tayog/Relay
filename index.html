<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — random 1-on-1 stranger chat</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/app.css?v=2">
</head>
<body class="min-h-screen flex justify-center p-4" style="background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 45%, #fef3c7 100%); height: 100vh; height: 100dvh;">
<div class="blob w-72 h-72 bg-orange-300 left-[-4rem] top-[-4rem]" aria-hidden="true"></div>
<div class="blob w-80 h-80 bg-amber-200 right-[-5rem] bottom-[-5rem]" aria-hidden="true"></div>
<div class="blob w-56 h-56 bg-rose-200 left-[38%] bottom-[-6rem]" aria-hidden="true"></div>

<div class="page-in relative z-10 w-full max-w-xl bg-white/95 rounded-[2rem] shadow-[0_20px_60px_-15px_rgba(194,120,20,.35)] border-4 border-white flex flex-col overflow-hidden" style="height: calc(100vh - 2rem); height: calc(100dvh - 2rem); max-height: 860px;">

  <header class="px-5 py-3.5 bg-white border-b-2 border-orange-100 flex items-center gap-3 flex-wrap">
    <span class="w-10 h-10 rounded-2xl bg-orange-500 text-white grid place-items-center shadow-md rotate-[-6deg]" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4V5a2 2 0 0 1 2-2z" opacity=".95"/><circle cx="9" cy="11" r="1.4" fill="#fff"/><circle cx="13.5" cy="11" r="1.4" fill="#fff"/><circle cx="18" cy="11" r="1.4" fill="#fff" transform="translate(-1.5 0)"/></svg>
    </span>
    <h1 class="font-display text-2xl font-extrabold tracking-tight flex-1">Relay</h1>
    <span id="stats" role="status" class="text-xs font-bold text-slate-600 bg-amber-100 border-2 border-amber-200 rounded-full px-3 py-1">0 online</span>
    <div id="status" class="flex items-center gap-1.5 text-xs font-semibold text-slate-500">
      <span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-400 inline-block"></span>
      <span id="statusText">Idle</span>
    </div>
  </header>

  <!-- Landing: required display name + search -->
  <section id="view-landing" class="flex-1 flex flex-col justify-center gap-5 p-6 sm:p-8 overflow-y-auto">
    <div class="text-center">
      <p class="font-display text-3xl sm:text-4xl font-extrabold leading-tight">Meet a <span class="text-orange-500">stranger</span>,<br>keep the good chats.</p>
      <p class="mt-2 text-sm font-semibold text-slate-500">Random 1-on-1 chat. Skip anytime for someone new. Chats burn forever when anyone leaves.</p>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center text-xs font-bold text-slate-600">
      <div class="bg-orange-50 border-2 border-orange-100 rounded-2xl px-2 py-3"><span class="font-display text-lg text-orange-500 block">1</span>Pick a name</div>
      <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl px-2 py-3"><span class="font-display text-lg text-amber-500 block">2</span>Search</div>
      <div class="bg-rose-50 border-2 border-rose-100 rounded-2xl px-2 py-3"><span class="font-display text-lg text-rose-400 block">3</span>Skip around</div>
    </div>
    <div>
      <label for="name" class="text-sm font-extrabold">Your display name (required)</label>
      <input id="name" placeholder="e.g. Alex" maxlength="32" autocomplete="username" required aria-describedby="nameError"
        class="mt-1.5 w-full px-4 py-3 text-base font-semibold border-[3px] border-slate-200 rounded-2xl bg-slate-50 focus:outline-none focus:border-orange-400 focus:bg-white placeholder:text-slate-400 placeholder:font-medium">
      <p id="nameError" class="hidden mt-1.5 text-sm font-bold text-rose-600">Please enter a display name first.</p>
    </div>
    <button id="searchBtn" disabled class="font-display w-full py-3.5 text-lg font-bold rounded-full bg-orange-500 text-white shadow-[0_6px_0_#c2410c] active:shadow-none active:translate-y-1.5 hover:bg-orange-400 disabled:opacity-40 disabled:shadow-none disabled:translate-y-0 transition-all">Search for a stranger</button>
  </section>
</div>

<script type="module" src="./assets/js/landing.js"></script>
</body>
</html>
