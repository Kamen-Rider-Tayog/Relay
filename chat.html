<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — chat</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/app.css?v=2">
</head>
<body class="min-h-screen flex justify-center p-4" style="background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 45%, #fef3c7 100%); height: 100vh; height: 100dvh;">
<div class="blob w-72 h-72 bg-orange-300 left-[-4rem] top-[-4rem]" aria-hidden="true"></div>
<div class="blob w-80 h-80 bg-amber-200 right-[-5rem] bottom-[-5rem]" aria-hidden="true"></div>

<div class="page-in relative z-10 w-full max-w-xl bg-white/95 rounded-[2rem] shadow-[0_20px_60px_-15px_rgba(194,120,20,.35)] border-4 border-white flex flex-col overflow-hidden" style="height: calc(100vh - 2rem); height: calc(100dvh - 2rem); max-height: 860px;">

  <header class="px-5 py-3.5 bg-white border-b-2 border-orange-100 flex items-center gap-3 flex-wrap">
    <a href="./index.html" class="text-xs font-extrabold px-3 py-1.5 rounded-full bg-slate-100 text-slate-500 border-2 border-slate-200 hover:bg-slate-200 hover:text-slate-700 transition-all" aria-label="Back to front page">← Home</a>
    <h1 class="font-display text-2xl font-extrabold tracking-tight flex-1 text-center">Relay</h1>
    <div id="status" class="flex items-center gap-1.5 text-xs font-semibold text-slate-500">
      <span id="dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse inline-block"></span>
      <span id="statusText">Joining…</span>
    </div>
  </header>

  <!-- Chat -->
  <section id="view-chat" class="flex-1 flex flex-col overflow-hidden relative">
    <div class="px-4 py-2.5 bg-gradient-to-r from-orange-50 to-amber-50 border-b-2 border-orange-100 flex items-center gap-2.5">
      <span id="peerAvatar" class="w-9 h-9 rounded-full bg-orange-500 text-white font-display font-bold grid place-items-center text-lg shrink-0" aria-hidden="true">?</span>
      <span class="flex-1 min-w-0">
        <span id="peerLabel" class="block text-sm font-extrabold truncate">Joining…</span>
        <span id="peerPresence" class="hidden items-center gap-1 text-[11px] font-bold text-emerald-600"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>online</span>
      </span>
      <button id="skipBtn" class="font-display text-sm font-bold px-4 py-2 rounded-full bg-amber-400 text-amber-950 shadow-[0_4px_0_#b45309] active:shadow-none active:translate-y-1 hover:bg-amber-300 transition-all">Skip / Next</button>
      <button id="pauseBtn" aria-label="Pause chat" class="font-display text-sm font-bold px-4 py-2 rounded-full bg-slate-100 text-slate-600 border-2 border-slate-200 shadow-[0_4px_0_#cbd5e1] active:shadow-none active:translate-y-1 hover:bg-slate-200 transition-all">Pause</button>
    </div>
    <div class="relative flex-1 flex flex-col overflow-hidden">
      <div id="noticeHost" class="absolute top-0 left-0 right-0 z-10 pointer-events-none"></div>
      <main id="chat" aria-live="polite" class="flex-1 overflow-y-auto p-4 flex flex-col gap-1.5" style="background: #fffbeb;"></main>
      <div id="emptyState" class="absolute inset-0 grid place-items-center pointer-events-none">
        <p class="text-center px-8"><span class="font-display text-xl font-bold text-slate-400 block">You're in! Say hi.</span><span class="text-sm font-semibold text-slate-400">Break the ice before someone hits Skip.</span></p>
      </div>
      <div id="endCard" class="hidden absolute inset-0 place-items-center bg-white/70 backdrop-blur-[2px] p-6">
        <div class="bg-white border-[3px] border-orange-100 rounded-3xl shadow-xl p-6 text-center max-w-xs">
          <p id="endTitle" class="font-display text-xl font-bold">Chat burned.</p>
          <p id="endText" class="mt-1 text-sm font-semibold text-slate-500">That pairing is gone forever.</p>
          <button id="searchAgainBtn" class="font-display mt-4 w-full py-2.5 font-bold rounded-full bg-orange-500 text-white shadow-[0_5px_0_#c2410c] active:shadow-none active:translate-y-1 hover:bg-orange-400 transition-all">Find someone new</button>
          <a href="./index.html" class="mt-2 inline-block text-xs font-extrabold text-slate-400 hover:text-slate-600 underline underline-offset-2">Back to front page</a>
        </div>
      </div>
    </div>
    <form id="form" class="flex gap-2 p-3 bg-white border-t-2 border-orange-100">
      <input id="input" placeholder="Type a message…" maxlength="2000" autocomplete="off" aria-label="Type a message"
        class="flex-1 px-4 py-2.5 border-[3px] border-slate-200 rounded-full bg-slate-50 font-semibold focus:outline-none focus:border-orange-400 focus:bg-white placeholder:text-slate-400 placeholder:font-medium">
      <button id="send" type="submit" disabled aria-label="Send message" class="w-12 h-12 shrink-0 rounded-full bg-orange-500 text-white grid place-items-center shadow-[0_4px_0_#c2410c] active:shadow-none active:translate-y-1 hover:bg-orange-400 disabled:opacity-40 disabled:shadow-none transition-all">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>
  </section>
</div>

<script type="module" src="./assets/js/chat.js"></script>
</body>
</html>
